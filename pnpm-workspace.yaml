packages:
  - "packages/*"
  - "playground"
  - "runtime/*"
  - "vue-components/*"
  - "react-components/*"
  - "eslint-config"

# Link matching workspace packages so release lockfile updates do not
# fetch a just-bumped @tmagic/* version from the registry.
linkWorkspacePackages: true

minimumReleaseAge: 0

allowBuilds:
  "@parcel/watcher": true
  core-js: true
  esbuild: true

catalog:
  "@vue/compiler-sfc": ^3.5.43
  typescript: "^6.0.3"
  vite: ^8.3.0
  vue: ^3.5.43
  element-plus: ^2.14.6

overrides:
  element-plus: ^2.14.6
  vue: ^3.5.43
